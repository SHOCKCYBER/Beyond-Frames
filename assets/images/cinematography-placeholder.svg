<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="cineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a10" />
      <stop offset="50%" stop-color="#141422" />
      <stop offset="100%" stop-color="#07070a" />
    </linearGradient>
    <radialGradient id="goldBeam" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#e5a950" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#e5a950" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanFlare" cx="20%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <rect width="1200" height="750" fill="url(#cineGrad)" />
  <rect width="1200" height="750" fill="url(#goldBeam)" />
  <rect width="1200" height="750" fill="url(#cyanFlare)" />
  
  <!-- Anamorphic Lens Flare Line -->
  <line x1="0" y1="360" x2="1200" y2="360" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
  <ellipse cx="600" cy="360" rx="300" ry="2" fill="#38bdf8" opacity="0.6" filter="blur(2px)" />
  
  <!-- Framing Box -->
  <rect x="80" y="60" width="1040" height="630" fill="none" stroke="#e5a950" stroke-width="1.5" stroke-dasharray="16 8" opacity="0.3" />
  
  <!-- Center Aperture & Cinema Graphics -->
  <circle cx="600" cy="360" r="140" fill="none" stroke="#e5a950" stroke-width="2" opacity="0.5" />
  <circle cx="600" cy="360" r="80" fill="#0f0f18" stroke="#ffffff" stroke-width="2" opacity="0.8" />
  <circle cx="600" cy="360" r="28" fill="#e5a950" opacity="0.9" />

  <!-- Corner Cinema Crop Marks -->
  <path d="M100 80 L100 120 M100 80 L140 80" stroke="#e5a950" stroke-width="3" />
  <path d="M1100 80 L1100 120 M1100 80 L1060 80" stroke="#e5a950" stroke-width="3" />
  <path d="M100 670 L100 630 M100 670 L140 670" stroke="#e5a950" stroke-width="3" />
  <path d="M1100 670 L1100 630 M1100 670 L1060 670" stroke="#e5a950" stroke-width="3" />

  <text x="600" y="540" font-family="'Syne', 'Inter', sans-serif" font-size="28" font-weight="800" letter-spacing="8" fill="#FFFFFF" text-anchor="middle">
    BEYOND FRAMES
  </text>
  <text x="600" y="580" font-family="'Inter', sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#E5A950" text-anchor="middle">
    CINEMATOGRAPHY &bull; 2.39:1 ANAMORPHIC MASTER
  </text>
</svg>
